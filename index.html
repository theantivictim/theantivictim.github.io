
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ANTI VICTIM | TERMINAL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Climate Crisis';
            src: url('https://fonts.gstatic.com/s/climatecrisis/v4/wXKuE3EaE6c-P4Qv0uO3uGvD3N2kR9sP.woff2') format('woff2');
            font-weight: 400;
        }

        :root {
            --bg: #030303;
            --neon-primary: #F8FC6A;
            --neon-danger: #FF0055;
            --text-main: #E0E0E0;
            --text-muted: #555555;
            --border-dim: rgba(248, 252, 106, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: Helvetica, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* --- SICK LOADING SCREEN --- */
        #boot-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; z-index: 9999; display: flex; flex-direction: column;
            justify-content: flex-end; padding: 40px; font-size: 14px; color: var(--neon-primary);
            text-shadow: 0 0 5px var(--neon-primary); pointer-events: none;
            transition: opacity 0.8s cubic-bezier(0.86, 0, 0.07, 1);
        }
        .boot-line { margin-bottom: 8px; opacity: 0; animation: typeLine 0.1s forwards; }
        @keyframes typeLine { to { opacity: 1; } }

        /* --- PIXEL & SCANLINE OVERLAYS --- */
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            z-index: 900; pointer-events: none;
            opacity: 0.6;
        }
        .vignette {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, transparent 30%, #000 120%);
            z-index: 800; pointer-events: none;
        }

        /* --- HEATWAVE / FLUID DISTORTION BACKGROUND --- */
        .heatwave-container {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 0; overflow: hidden; filter: url(#heatwave-filter) blur(15px);
            opacity: 0.4;
        }
        .heat-orb {
            position: absolute; border-radius: 50%; mix-blend-mode: screen;
            animation: orbFloat infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }
        .orb-1 { width: 80vw; height: 80vw; background: radial-gradient(circle, #F8FC6A 0%, transparent 60%); left: -20%; top: -20%; animation-duration: 14s; }
        .orb-2 { width: 90vw; height: 90vw; background: radial-gradient(circle, #FF0055 0%, transparent 60%); right: -30%; bottom: -10%; animation-duration: 18s; }
        .orb-3 { width: 60vw; height: 60vw; background: radial-gradient(circle, #3366FF 0%, transparent 60%); left: 30%; top: 40%; animation-duration: 22s; }
        @keyframes orbFloat { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(10vw, 15vh) scale(1.1); } }

        /* --- MAIN UI / BRUTALIST GRID --- */
        .ui-layer {
            position: relative; z-index: 100; display: flex; flex-direction: column;
            width: 100vw; height: 100vh; padding: 40px;
        }
        header {
            display: flex; justify-content: space-between; align-items: flex-start;
            margin-bottom: 40px; border-bottom: 1px solid var(--border-dim); padding-bottom: 20px;
        }
        h1 {
            font-family: 'Climate Crisis', sans-serif; font-size: clamp(3rem, 6vw, 6rem);
            color: #FFF; line-height: 0.9; text-transform: uppercase;
            letter-spacing: -0.05em; mix-blend-mode: difference;
        }
        .status-badge {
            font-size: 12px; font-weight: 800; padding: 6px 12px;
            border: 1px solid var(--neon-primary); color: var(--neon-primary);
            text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 0 10px rgba(248, 252, 106, 0.2);
            animation: pulse 2s infinite;
        }

        /* --- SEARCH AND LIST --- */
        .search-box {
            background: transparent; border: 1px solid var(--border-dim);
            color: var(--neon-primary); font-family: 'JetBrains Mono', monospace;
            font-size: 24px; padding: 20px; width: 100%; max-width: 600px;
            outline: none; text-transform: uppercase; margin-bottom: 30px;
            transition: all 0.3s;
        }
        .search-box:focus { border-color: var(--neon-primary); box-shadow: 0 0 20px rgba(248, 252, 106, 0.2); }
        .search-box::placeholder { color: var(--text-muted); }

        .list-container {
            flex-grow: 1; overflow-y: auto; display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px;
            padding-right: 10px; padding-bottom: 40px;
        }
        .list-container::-webkit-scrollbar { width: 4px; }
        .list-container::-webkit-scrollbar-thumb { background: var(--border-dim); }

        /* --- INTERACTIVE CARDS --- */
        .guest-card {
            background: rgba(10, 10, 10, 0.6); border: 1px solid var(--border-dim);
            padding: 24px; cursor: pointer; transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            position: relative; overflow: hidden; backdrop-filter: blur(5px);
        }
        .guest-card::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(248,252,106,0.1), transparent);
            transition: 0.5s; z-index: -1;
        }
        .guest-card:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: var(--neon-primary);
            box-shadow: 0 10px 30px rgba(248, 252, 106, 0.1);
        }
        .guest-card:hover::before { left: 100%; }
        
        .g-name { font-size: 20px; font-weight: 700; margin-bottom: 8px; color: #FFF; text-transform: uppercase; }
        .g-tier { font-size: 11px; color: var(--neon-primary); letter-spacing: 1px; }
        
        /* --- GLITCH MODAL --- */
        #modal {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.9); z-index: 2000; flex-direction: column;
            justify-content: center; align-items: center; padding: 20px;
            backdrop-filter: blur(20px);
        }
        .modal-box {
            background: #050505; border: 1px solid var(--neon-primary);
            padding: 40px; width: 100%; max-width: 500px; position: relative;
            box-shadow: 0 0 50px rgba(248,252,106,0.1);
        }
        .modal-box.glitch-anim { animation: rgbGlitch 0.3s steps(2) forwards; }
        
        .m-name { font-family: 'Climate Crisis', sans-serif; font-size: 32px; color: var(--neon-primary); line-height: 1; margin-bottom: 20px; text-transform: uppercase; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .input-group input { 
            width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--border-dim);
            color: #FFF; font-family: 'JetBrains Mono'; font-size: 18px; padding: 10px 0; outline: none; transition: 0.3s;
        }
        .input-group input:focus { border-bottom-color: var(--neon-primary); }
        
        .auth-btn {
            background: var(--neon-primary); color: #000; border: none; width: 100%;
            padding: 18px; font-family: 'JetBrains Mono'; font-weight: 800; font-size: 16px;
            text-transform: uppercase; letter-spacing: 2px; cursor: pointer; margin-top: 20px;
            transition: all 0.2s; position: relative; overflow: hidden;
        }
        .auth-btn:hover { background: #FFF; }

        .school-btn {
            background: transparent;
            color: var(--neon-danger);
            border: 1px solid var(--neon-danger);
            margin-top: 10px;
        }
        .school-btn:hover { background: var(--neon-danger); color: #FFF; }
        
        .close-btn { position: absolute; top: 20px; right: 20px; color: var(--text-muted); cursor: pointer; font-size: 24px; }
        
        /* --- SUCCESS OVERLAY --- */
        #success-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--neon-primary); z-index: 3000; flex-direction: column;
            justify-content: center; align-items: center; color: #000;
        }
        #success-overlay h2 { font-family: 'Climate Crisis'; font-size: 5vw; text-transform: uppercase; mix-blend-mode: multiply; }
        
        @keyframes rgbGlitch {
            0% { transform: translate(0) }
            20% { transform: translate(-3px, 3px); filter: drop-shadow(3px 0 0 red) drop-shadow(-3px 0 0 blue); }
            40% { transform: translate(-3px, -3px); filter: drop-shadow(3px 0 0 red) drop-shadow(-3px 0 0 blue); }
            60% { transform: translate(3px, 3px); filter: drop-shadow(3px 0 0 red) drop-shadow(-3px 0 0 blue); }
            80% { transform: translate(3px, -3px); filter: drop-shadow(3px 0 0 red) drop-shadow(-3px 0 0 blue); }
            100% { transform: translate(0); filter: none; }
        }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
    </style>
</head>
<body>

<!-- SVG Filters for Heatwave -->
<svg style="display:none;">
  <filter id="heatwave-filter">
    <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="3" result="noise" />
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="50" xChannelSelector="R" yChannelSelector="G" />
  </filter>
</svg>

<!-- Boot Sequence -->
<div id="boot-screen"></div>

<div class="heatwave-container">
    <div class="heat-orb orb-1"></div>
    <div class="heat-orb orb-2"></div>
    <div class="heat-orb orb-3"></div>
</div>
<div class="vignette"></div>
<div class="scanlines"></div>

<div class="ui-layer" id="main-ui" style="opacity:0; transition: opacity 1s;">
    <header>
        <h1>ANTI<br>VICTIM</h1>
        <div class="status-badge">SYSTEM ONLINE</div>
    </header>
    <input type="text" id="search" class="search-box" placeholder="SCAN DATABASE..." autocomplete="off" autocorrect="off">
    <div class="list-container" id="list"></div>
</div>

<div id="modal">
    <div class="modal-box" id="modal-content">
        <div class="close-btn" onclick="closeModal()">&times;</div>
        <div class="m-name" id="m-name"></div>
        <input type="hidden" id="m-row">
        <input type="hidden" id="m-tier">
        <div class="input-group">
            <label>Verify Email / Link</label>
            <input type="email" id="m-email" placeholder="Required for transmission">
        </div>
        <div class="input-group">
            <label>Phone Number</label>
            <input type="tel" id="m-phone" placeholder="Optional">
        </div>
        <button class="auth-btn" onclick="submitAuth()">AUTHENTICATE USER</button>
        <button class="auth-btn school-btn" onclick="window.open('https://www.skool.com/', '_blank')">JOIN THE SCHOOL COMMUNITY</button>
    </div>
</div>

<div id="success-overlay">
    <h2>ACCESS GRANTED</h2>
    <p style="font-weight:bold; font-size:18px; margin-top:20px;">TRANSMITTING PROTOCOL TO DEVICE...</p>
</div>

<script>
    let allData = [];
    const API_BASE = "https://antivictim-api.loca.lt";

    // Boot Sequence Logic
    const bootLines = [
        "INITIALIZING CORE SYSTEMS...",
        "BYPASSING MAINFRAME ENCRYPTION...",
        "ALLOCATING HEATMAP SHADERS...",
        "CONNECTING TO THE VOID...",
        "ACCESS GRANTED."
    ];
    
    async function runBootSequence() {
        const bootScreen = document.getElementById('boot-screen');
        for(let i = 0; i < bootLines.length; i++) {
            const el = document.createElement('div');
            el.className = 'boot-line';
            el.innerText = `> ${bootLines[i]}`;
            bootScreen.appendChild(el);
            await new Promise(r => setTimeout(r, 300 + Math.random() * 400));
        }
        await new Promise(r => setTimeout(r, 500));
        bootScreen.style.opacity = '0';
        document.getElementById('main-ui').style.opacity = '1';
        setTimeout(() => bootScreen.remove(), 1000);
        fetchData();
    }

    async function fetchData() {
        try {
            const res = await fetch(`${API_BASE}/attendees`, { headers: { 'Bypass-Tunnel-Reminder': 'true' } });
            allData = await res.json();
            renderList(allData);
        } catch(e) {
            console.error(e);
        }
    }

    function renderList(data) {
        const cont = document.getElementById('list');
        cont.innerHTML = '';
        data.forEach(g => {
            const el = document.createElement('div');
            el.className = 'guest-card';
            el.innerHTML = `
                <div class="g-name">${g.name || 'UNKNOWN'}</div>
                <div class="g-tier">[ ${g.tier || 'GUEST'} ]</div>
            `;
            el.onclick = () => openModal(g);
            cont.appendChild(el);
        });
    }

    document.getElementById('search').addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase();
        renderList(allData.filter(g => g.name.toLowerCase().includes(q)));
    });

    function openModal(g) {
        document.getElementById('m-name').innerText = g.name;
        document.getElementById('m-email').value = g.email || '';
        document.getElementById('m-phone').value = g.phone || '';
        document.getElementById('m-row').value = g.row_index;
        document.getElementById('m-tier').value = g.tier;
        
        const m = document.getElementById('modal');
        const c = document.getElementById('modal-content');
        m.style.display = 'flex';
        c.classList.remove('glitch-anim');
        void c.offsetWidth; // trigger reflow
        c.classList.add('glitch-anim');
    }

    function closeModal() {
        document.getElementById('modal').style.display = 'none';
    }

    async function submitAuth() {
        const btn = document.querySelector('.auth-btn');
        btn.innerText = "TRANSMITTING...";
        btn.style.pointerEvents = 'none';
        
        const payload = {
            name: document.getElementById('m-name').innerText,
            email: document.getElementById('m-email').value,
            phone: document.getElementById('m-phone').value,
            row_index: document.getElementById('m-row').value,
            tier: document.getElementById('m-tier').value
        };

        try {
            await fetch(`${API_BASE}/submit`, {
                method: 'POST',
                headers: {
                    'Bypass-Tunnel-Reminder': 'true',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });
            closeModal();
            const succ = document.getElementById('success-overlay');
            succ.style.display = 'flex';
            
            setTimeout(() => {
                succ.style.display = 'none';
                btn.innerText = "AUTHENTICATE USER";
                btn.style.pointerEvents = 'auto';
                document.getElementById('search').value = '';
                fetchData();
            }, 3000);
        } catch(e) {
            alert("NETWORK FAILURE.");
            btn.innerText = "AUTHENTICATE USER";
            btn.style.pointerEvents = 'auto';
        }
    }

    window.onload = runBootSequence;
</script>
</body>
</html>
